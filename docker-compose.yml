name: rainbot

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot setup ──────────────────────────────────────────────────────────

  db-migrate:
    image: ghcr.io/rainbow-sands/rainbot-sands/db:main
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: "no"

  # ── Application ─────────────────────────────────────────────────────────────

  discord:
    image: ghcr.io/rainbow-sands/rainbot-sands/discord:main
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      MEDIA_PATH: /media
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - media:/media
    restart: unless-stopped

  worker:
    image: ghcr.io/rainbow-sands/rainbot-sands/worker:main
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      WEB_URL: ${ORIGIN}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL}
      SUMMARIZATION_PROVIDER: ${SUMMARIZATION_PROVIDER}
      SUMMARIZATION_API_KEY: ${SUMMARIZATION_API_KEY}
      SUMMARIZATION_BASE_URL: ${SUMMARIZATION_BASE_URL}
      SUMMARIZATION_MODEL: ${SUMMARIZATION_MODEL}
      SUMMARIZATION_REASONING_EFFORT: ${SUMMARIZATION_REASONING_EFFORT}
      SUMMARIZATION_THINKING_BUDGET: ${SUMMARIZATION_THINKING_BUDGET}
      TRANSCRIPTION_CONCURRENCY: ${TRANSCRIPTION_CONCURRENCY}
      SUMMARIZATION_CONCURRENCY: ${SUMMARIZATION_CONCURRENCY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEDIA_PATH: /media
    volumes:
      - media:/media
    restart: unless-stopped

  web:
    image: ghcr.io/rainbow-sands/rainbot-sands/web:main
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ORIGIN: ${ORIGIN}
      CHAT_PROVIDER: ${CHAT_PROVIDER}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT}
      CHAT_THINKING_BUDGET: ${CHAT_THINKING_BUDGET}
      REDIS_URL: redis://redis:6379
      MEDIA_PATH: /media
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-10G}
    ports:
      - "3000:3000"
    volumes:
      - media:/media
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media:
